[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflowkit"
version = "0.0.2"
description = "Reactive recovery for LLM API calls — compact-and-retry, strip-and-retry, and truncation recovery."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reflow"]
